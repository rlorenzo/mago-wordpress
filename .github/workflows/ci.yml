name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check
        run: just check

  lowest-mago:
    name: Lowest supported mago
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Downgrade to the lowest supported mago
        run: composer update carthage-software/mago --prefer-lowest --prefer-stable --no-interaction

      - name: Check
        run: just check

  latest-mago:
    name: Latest mago
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Surfaces a Mago rule/option rename or schema change before consumers hit it.
      - name: Upgrade to the latest mago
        run: composer update carthage-software/mago --with-all-dependencies --no-interaction

      - name: Check
        run: just check

  consumer-smoke:
    name: Consumer smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install this package as a consumer would
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          composer init --no-interaction --name=mago-wordpress/consumer-smoke -q
          composer config repositories.local path "$GITHUB_WORKSPACE"
          # A plain (non --dev) require: the smoke test runs with only the extension's declared
          # runtime requires installed, as a consumer would.
          composer require --no-interaction carthage-software/mago 'rlorenzo/mago-wordpress:*@dev'

          cat > mago.toml <<'EOF'
          extends = "vendor/rlorenzo/mago-wordpress/wordpress.mago.toml"
          php-version = "8.1"

          [source]
          paths = ["redirect.php"]
          EOF

          cat > redirect.php <<'EOF'
          <?php

          $url = 'https://example.com';
          wp_redirect($url);

          function smoke_lookup(wpdb $wpdb): void
          {
              $wpdb->query('SELECT * FROM t WHERE id = ' . $_POST['id']);
          }
          EOF

          # mago exits non-zero when it reports issues; the greps below are the assertion.
          # The last three are Mago core rules that ship disabled; wordpress.mago.toml enables them.
          # Pin the format: on GitHub Actions Mago otherwise emits ::warning annotations.
          out=$(vendor/bin/mago lint --reporting-format short 2>&1 || true)
          echo "$out"
          for rule in wordpress/safe-redirect nonce-verification validated-sanitized-input prepared-sql; do
            grep -q "\[$rule\]" <<< "$out" || {
              echo "error: $rule was not reported" >&2
              exit 1
            }
          done

  wpcs-lists:
    name: WPCS lists
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # Lists.php and CoreClasses.php must be exactly what bin/generate-lists.php produces
      # from the pinned WPCS tag, and the pin must be the latest WPCS release.
      - name: Check generated lists against WPCS
        run: |
          set -euo pipefail
          pinned=$(sed -n "s/^const WPCS_VERSION = '\(.*\)';/\1/p" bin/generate-lists.php)
          repo=https://github.com/WordPress/WordPress-Coding-Standards
          git clone --quiet --depth 1 --branch "$pinned" "$repo" "$RUNNER_TEMP/wpcs"
          php bin/generate-lists.php "$RUNNER_TEMP/wpcs" --check
          latest=$(git ls-remote --tags --refs "$repo" | sed 's#.*/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$latest" != "$pinned" ]; then
            echo "::error::WPCS $latest is out (pinned $pinned): bump WPCS_VERSION in bin/generate-lists.php and regenerate"
            exit 1
          fi
