name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check
        run: just check

  lowest-mago:
    name: Lowest supported mago
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Downgrade to the lowest supported mago
        run: composer update carthage-software/mago --prefer-lowest --prefer-stable --no-interaction

      - name: Check
        run: just check

  consumer-smoke:
    name: Consumer smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install this package as a consumer would
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          composer init --no-interaction --name=mago-wordpress/consumer-smoke -q
          composer config repositories.local path "$GITHUB_WORKSPACE"
          # A plain (non --dev) require: the smoke test runs with only the extension's declared
          # runtime requires installed, as a consumer would.
          composer require --no-interaction carthage-software/mago 'rlorenzo/mago-wordpress:*@dev'

          cat > mago.toml <<'EOF'
          extends = "vendor/rlorenzo/mago-wordpress/wordpress.mago.toml"
          php-version = "8.1"

          [source]
          paths = ["redirect.php"]
          EOF

          cat > redirect.php <<'EOF'
          <?php

          $url = 'https://example.com';
          wp_redirect($url);

          function smoke_lookup(wpdb $wpdb): void
          {
              $wpdb->query('SELECT * FROM t WHERE id = ' . $_POST['id']);
          }
          EOF

          # mago exits non-zero when it reports issues; the greps below are the assertion.
          # The last three are Mago core rules that ship disabled; wordpress.mago.toml enables them.
          # Pin the format: on GitHub Actions Mago otherwise emits ::warning annotations.
          out=$(vendor/bin/mago lint --reporting-format short 2>&1 || true)
          echo "$out"
          for rule in wordpress/safe-redirect nonce-verification validated-sanitized-input prepared-sql; do
            echo "$out" | grep -q "\[$rule\]" || {
              echo "error: $rule was not reported" >&2
              exit 1
            }
          done

