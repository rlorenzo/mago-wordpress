# Extend this file from your project's mago.toml to enable the WordPress extension with the
# full WordPress standard (WordPress-Core + WordPress-Docs + WordPress-Extra + the rest):
#
#     extends = "vendor/rlorenzo/mago-wordpress/wordpress.mago.toml"
#
# For a project that ran phpcs with WordPress-Extra or WordPress-Core, extend
# wordpress-extra.mago.toml or wordpress-core.mago.toml next to this file instead.
#
# Rule settings (text domains, prefixes, minimum WordPress version) are read from
# composer.json `extra.mago-wordpress`, or from phpcs.xml if that is absent.

[linter.rules]
# WordPress-Docs' Squiz.Commenting.{Function,Class,Variable}Comment.Missing: a docblock on every
# function, method, class and property (not interfaces, traits, enums or constants). Reports at
# Mago's `help` level, so it does not fail a build; see docs/wpcs-coverage.md (WordPress-Docs).
missing-docs = { enabled = true, classes = true, methods = true, properties = true, constants = false, enum-cases = false, statics = false }
# Mago's own WordPress rules and its rules no WPCS sniff runs are off, so a phpcs-clean project
# stays clean; this package's wordpress/* rules port the WordPress ones.
# BEGIN generated by bin/generate-presets.php: Mago core rules that report what no WPCS sniff does
# are off, apart from four quiet security rules (tainted-data-to-sink, no-unsafe-finally,
# no-variable-variable, no-ffi). class-name is off because it reports code
# PEAR ValidClassName accepts. The ones that port a sniff report at its phpcs level, and
# array-style is `long` as WordPress-Core requires (`mago lint --fix --only array-style` converts).
assert-description = { enabled = false }
block-statement = { enabled = false }
braced-string-interpolation = { enabled = false }
class-name = { enabled = false }
combine-consecutive-issets = { enabled = false }
constant-condition = { enabled = false }
constant-name = { enabled = false }
cyclomatic-complexity = { enabled = false }
deprecated-cast = { enabled = false }
deprecated-shell-execute-string = { enabled = false }
deprecated-switch-semicolon = { enabled = false }
disallowed-functions = { enabled = false }
enum-name = { enabled = false }
excessive-nesting = { enabled = false }
excessive-parameter-list = { enabled = false }
explicit-nullable-param = { enabled = false }
explicit-octal = { enabled = false }
file-name = { enabled = false }
function-name = { enabled = false }
halstead = { enabled = false }
identity-comparison = { enabled = false }
ineffective-format-ignore-next = { enabled = false }
ineffective-format-ignore-region = { enabled = false }
inline-variable-return = { enabled = false }
instanceof-stringable = { enabled = false }
interface-name = { enabled = false }
invalid-open-tag = { enabled = false }
kan-defect = { enabled = false }
literal-named-argument = { enabled = false }
loop-does-not-iterate = { enabled = false }
no-alias-function = { enabled = false }
no-assign-in-condition = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
no-closing-tag = { enabled = false }
no-duplicate-match-arm = { enabled = false }
no-else-clause = { enabled = false }
no-empty = { enabled = false }
no-empty-catch-clause = { enabled = false }
no-empty-comment = { enabled = false }
no-empty-loop = { enabled = false }
no-error-control-operator = { enabled = false }
no-global = { enabled = false }
no-hash-comment = { enabled = false }
no-hash-emoji = { enabled = false }
no-insecure-comparison = { enabled = false }
no-isset = { enabled = false }
no-literal-password = { enabled = false }
no-missing-format-argument = { enabled = false }
no-multi-assignments = { enabled = false }
no-nested-ternary = { enabled = false }
no-php-tag-terminator = { enabled = false }
no-protected-in-final = { enabled = false }
no-redundant-binary-string-prefix = { enabled = false }
no-redundant-block = { enabled = false }
no-redundant-continue = { enabled = false }
no-redundant-file = { enabled = false }
no-redundant-isset = { enabled = false }
no-redundant-label = { enabled = false }
no-redundant-literal-return = { enabled = false }
no-redundant-math = { enabled = false }
no-redundant-method-override = { enabled = false }
no-redundant-nullsafe = { enabled = false }
no-redundant-parentheses = { enabled = false }
no-redundant-readonly = { enabled = false }
no-redundant-use = { enabled = false }
no-redundant-write-visibility = { enabled = false }
no-redundant-yield-from = { enabled = false }
no-request-variable = { enabled = false }
no-self-assignment = { enabled = false }
no-sprintf-concat = { enabled = false }
no-trailing-space = { enabled = false }
no-underscore-class = { enabled = false }
no-void-reference-return = { enabled = false }
optional-param-order = { enabled = false }
prefer-arrow-function = { enabled = false }
prefer-early-continue = { enabled = false }
prefer-first-class-callable = { enabled = false }
prefer-static-closure = { enabled = false }
readable-literal = { enabled = false }
require-preg-quote-delimiter = { enabled = false }
sensitive-parameter = { enabled = false }
single-class-per-file = { enabled = false }
str-contains = { enabled = false }
str-starts-with = { enabled = false }
strict-behavior = { enabled = false }
strict-types = { enabled = false }
suspicious-explode-arguments = { enabled = false }
tagged-fixme = { enabled = false }
tagged-todo = { enabled = false }
too-many-enum-cases = { enabled = false }
too-many-methods = { enabled = false }
too-many-properties = { enabled = false }
trait-name = { enabled = false }
use-compound-assignment = { enabled = false }
valid-docblock = { enabled = false }
array-style = { style = "long", level = "error" }
lowercase-keyword = { level = "error" }
lowercase-type-hint = { level = "error" }
no-debug-symbols = { level = "warning" }
no-goto = { level = "error" }
no-noop = { level = "warning" }
no-redundant-final = { level = "warning" }
no-redundant-string-concat = { level = "error" }
no-short-opening-tag = { level = "error" }
no-shorthand-ternary = { level = "error" }
prefer-while-loop = { level = "warning" }
# END generated

# The closest `mago fmt` gets to WordPress-Core. It cannot add the spaces WordPress puts inside
# call, declaration, control-structure and array parentheses (refused upstream, mago #446/#490);
# `mago lint --fix --only wordpress/parentheses-spacing` adds them after `mago format`.
# `vendor/bin/mago-wordpress format` runs every step; see docs/formatting.md.
[formatter]
use-tabs = true
function-brace-style = "same-line"
method-brace-style = "same-line"
classlike-brace-style = "same-line"
space-after-logical-not-unary-prefix-operator = true
space-within-grouping-parenthesis = true
align-assignment-like = true
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
# Keep a broken concatenation broken: joined, literals trip Generic.Strings.UnnecessaryStringConcat
# (allowMultiline in WordPress-Extra) and a translators comment ends up away from its string.
preserve-breaking-binary-expression = true
# WordPress has no line limit; 120 wraps long calls, even `<?php esc_html_e( '...' ); ?>` in HTML.
print-width = 1000
# `exit;`, not `exit();`.
parentheses-in-exit-and-die = false
# WordPress-Core asks for neither: templates keep a final `?>`, files don't gain a blank line after `<?php`.
remove-trailing-close-tag = false
empty-line-after-opening-tag = false
# Keep `a || ( b && c )`: without the parentheses Generic.CodeAnalysis.RequireExplicitBooleanOperatorPrecedence
# (generic/require-explicit-boolean-operator-precedence) reports the line.
preserve-redundant-logical-binary-expression-parentheses = true
# trailing-comma stays on (Mago's default): WordPress-Core requires one after a multi-line array's last item.

[extension-hosts.wordpress]
command = ["php", "vendor/rlorenzo/mago-wordpress/resources/worker.php"]
