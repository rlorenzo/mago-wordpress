# Extend this file from your project's mago.toml to enable the WordPress extension:
#
#     extends = "vendor/rlorenzo/mago-wordpress/wordpress.mago.toml"
#
# Rule settings (text domains, prefixes, minimum WordPress version) are read from
# composer.json `extra.mago-wordpress`, or from phpcs.xml if that is absent.

[linter]
integrations = ["wordpress"]

# Every WordPress security and database rule Mago ships is ported by this package as a wordpress/*
# rule, so the core ones are off (prepared-sql already ships disabled).
[linter.rules]
no-unescaped-output = { enabled = false }
use-wp-functions = { enabled = false }
no-direct-db-query = { enabled = false }
no-db-schema-change = { enabled = false }
no-roles-as-capabilities = { enabled = false }
require-preg-quote-delimiter = { enabled = false }
# WordPress-Docs' Squiz.Commenting.{Function,Class,Variable}Comment.Missing: a docblock on every
# function, method, class and property (not interfaces, traits, enums or constants). Reports at
# Mago's `help` level, so it does not fail a build; see docs/wpcs-coverage.md (WordPress-Docs).
missing-docs = { enabled = true, classes = true, methods = true, properties = true, constants = false, enum-cases = false, statics = false }
# WordPress-Core requires long arrays (Universal.Arrays.DisallowShortArraySyntax); Mago's
# default is the opposite. `mago lint --fix --only array-style` converts `[]` to `array()`.
array-style = { style = "long" }

# The closest `mago fmt` gets to WordPress-Core. It cannot add the spaces WordPress puts inside
# call, declaration, control-structure and array parentheses (refused upstream, mago #446/#490);
# `mago lint --fix --only wordpress/parentheses-spacing` adds them after `mago format`.
# `vendor/bin/mago-wordpress format` runs every step; see docs/formatting.md.
[formatter]
use-tabs = true
function-brace-style = "same-line"
method-brace-style = "same-line"
classlike-brace-style = "same-line"
space-after-logical-not-unary-prefix-operator = true
space-within-grouping-parenthesis = true
align-assignment-like = true
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
# WordPress has no line limit; 120 wraps long calls, even `<?php esc_html_e( '...' ); ?>` in HTML.
print-width = 1000
# `exit;`, not `exit();`.
parentheses-in-exit-and-die = false
# WordPress-Core asks for neither: templates keep a final `?>`, files don't gain a blank line after `<?php`.
remove-trailing-close-tag = false
empty-line-after-opening-tag = false
# trailing-comma stays on (Mago's default): WordPress-Core requires one after a multi-line array's last item.

[extension-hosts.wordpress]
command = ["php", "vendor/rlorenzo/mago-wordpress/resources/worker.php"]
